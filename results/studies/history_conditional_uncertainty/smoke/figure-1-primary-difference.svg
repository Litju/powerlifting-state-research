<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210" role="img" aria-label="Primary paired CRPS difference with intervals"><title>Primary paired CRPS difference with intervals</title><style>:root{--s:#fcfcfb;--t:#0b0b0b;--m:#52514e;--g:#d9d8d3;--a:#2a78d6;--b:#eb6834;}@media (prefers-color-scheme:dark){:root{--s:#1a1a19;--t:#f0efec;--m:#c3c2b7;--g:#3a3a38;--a:#3987e5;--b:#d95926;}}text{font:12px system-ui,sans-serif;fill:var(--t)}.m{fill:var(--m)}</style><rect width="800" height="210" fill="var(--s)"/><text x="40" y="30">Primary: H_HISTORY minus B_MAG macro CRPS (kg), control; negative favors history</text><line x1="400.0" y1="50" x2="400.0" y2="170" stroke="var(--g)"/><line x1="534.2" y1="90" x2="600.1" y2="90" stroke="var(--b)" stroke-width="2"/><circle cx="569.4" cy="90" r="5" fill="var(--b)"/><text class="m" x="40" y="94">TEST_A: +1.1979 [+0.9494, +1.4151] (+15.61%)</text><line x1="548.3" y1="140" x2="646.2" y2="140" stroke="var(--b)" stroke-width="2"/><circle cx="592.1" cy="140" r="5" fill="var(--b)"/><text class="m" x="40" y="144">TEST_B: +1.3587 [+1.0487, +1.7409] (+18.09%)</text><text class="m" x="400" y="190" text-anchor="middle">0 = no difference; 1% screen not drawn</text></svg>
