[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "powerlifting-state-research"
version = "0.1.0"
description = "Open research on latent powerlifting capacity, performance expression, and synthetic forecast evaluation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "LICENSE-DOCS"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/Litju/powerlifting-state-research/tree/main/docs"
Source = "https://github.com/Litju/powerlifting-state-research"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/powerlifting_state_research"]

[tool.hatch.build.targets.sdist]
include = [
  "artifacts/",
  "src/",
  "tests/",
  "docs/",
  "README.md",
  "LICENSE",
  "LICENSE-DOCS",
  "pyproject.toml",
  "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/powerlifting_state_research/provenance/historical_sources.py" = ["E501"]
"src/powerlifting_state_research/benchmarks/*/research.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["powerlifting_state_research"]
